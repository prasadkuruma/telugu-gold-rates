name: Auto Update Gold Rates
on:
  schedule:
    - cron: '45 4 * * *'   # ఉదయం 10:15 IST
    - cron: '30 11 * * *'  # సాయంత్రం 05:00 IST
  workflow_dispatch:       # ఎప్పుడైనా మాన్యువల్ గా టెస్ట్ చేయడానికి

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python update_gold.py
      - run: |
          git config user.name "GoldBot"
          git config user.email "bot@users.noreply.github.com"
          git add gold_rates.json
          git commit -m "Update gold rates" || exit 0
          git push
